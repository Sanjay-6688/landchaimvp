# Public test-demo deployment. Uses a separate Neon PostgreSQL project;
# do not use these free-tier services for production property records.
services:
  - type: web
    name: landchain-demo-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: BLOCKCHAIN_PRIVATE_KEY
        sync: false
      - key: LANDCHAIN_CONTRACT_ADDRESS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: PUBLIC_DEMO_POSTS_PER_MINUTE
        value: "20"

  - type: web
    name: landchain-demo-web
    runtime: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: landchain-demo-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
